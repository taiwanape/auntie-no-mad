<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Orbital Sonic Sandbox 是一個離線可玩的互動音像沙盒，用物理粒子、聲音節點與 Web Audio 生成即時環境音。">
  <title>Orbital Sonic Sandbox｜星軌環境音沙盒</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23030712'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2300f0ff'/%3E%3Cpath d='M10 38c13-20 31-24 44-12M13 47c12-9 25-12 40-9' fill='none' stroke='%23ff4fd8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="auntie-back" href="../../index.html#lab">← 阿姨實驗室</a>
  <canvas id="canvas" aria-label="互動音像沙盒畫布"></canvas>

  <section id="intro" class="intro" aria-labelledby="title">
    <p class="eyebrow">No dashboard · no data feed · just interaction</p>
    <h1 id="title">ORBITAL</h1>
    <p class="lead">點擊或觸碰畫面，放下會發聲的星軌節點。粒子撞上節點時會反彈、發光、觸發即時合成音。</p>
    <button id="startBtn" class="primary" type="button">啟動音像沙盒</button>
    <p class="hint">建議先開聲音。桌機用滑鼠，手機用手指。</p>
  </section>

  <aside id="hud" class="hud" aria-label="操作面板">
    <div>
      <span class="brand">ORBITAL</span>
      <span class="sub">星軌環境音沙盒</span>
    </div>
    <div class="stats" aria-label="狀態數據">
      <span>節點 <strong id="nodeCount">0</strong></span>
      <span>粒子 <strong id="particleCount">0</strong></span>
      <span>命中 <strong id="hitCount">0</strong></span>
    </div>
    <div class="controls">
      <button id="seedBtn" type="button">隨機星座</button>
      <button id="muteBtn" type="button">聲音開</button>
      <button id="clearBtn" type="button">清空</button>
    </div>
    <p class="microcopy">點一下放節點，拖曳可以畫出聲音路徑。按 <kbd>Space</kbd> 暫停，按 <kbd>R</kbd> 重置。</p>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
