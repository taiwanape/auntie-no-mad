      <h1>颱風薔蜜影響 基隆石垣島首航回程提早返台</h1>
      <p class="">（中央社記者潘欣彤基隆市31日電）基隆-石垣島定期航線28日首航，回程航班原定今晚從石垣島至基隆，受颱風薔蜜影響，提早至今天上午日本時間11時開航，於台灣時間晚間近8時抵基隆港。 阿姨提醒：先看來源、再看自己今天會不會被影響。</p>
      <div class="notice"><strong>阿姨一句話：</strong>天氣不是拿來焦慮的，是拿來決定要不要帶傘、改行程。</div>
