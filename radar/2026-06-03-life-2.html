      <h1>藍營三地門鄉長協調完成 屏警交通隊長謝志鴻出線</h1>
      <p class="">（中央社記者李卉婷屏東縣2日電）國民黨原有4人有意參選屏東縣三地門鄉長，昨天傍晚黨內完成協調作業，最後由屏東縣政府警察局交通隊長謝志鴻出線，他表示，將凝聚地方共識打拚。 阿姨提醒：先看來源、再看自己今天會不會被影響。</p>
      <div class="notice"><strong>阿姨一句話：</strong>交通消息先看一眼，少在月台或路上多煩十分鐘。</div>
