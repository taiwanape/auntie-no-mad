      <h1>婚假陪產假天數加碼 補助職代津貼每日800元</h1>
      <p>（中央社記者吳欣紜台北27日電）政府宣布「台灣人口對策新戰略」18項措施，包含加碼婚假、產假、陪產假天數，新增薪資由政府負擔，若企業發職代津貼、新聘替代人力也有補助，其中職代津貼補助為每日800元。 阿姨提醒：先看來源、再看自己今天會不會被影響。</p>
