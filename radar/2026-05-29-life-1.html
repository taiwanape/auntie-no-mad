      <h1>捷運三鶯線拚年中通車 尖峰最短班距擬2.2分鐘</h1>
      <p>（中央社記者曹亞沿新北28日電）新北議員關切捷運三鶯線進度，市長侯友宜說，交通部今開會決定履勘日期，朝年中通車目標邁進。未來尖峰最短擬2.2分鐘一班，但初期尖峰時間班距約5至6分鐘，後續再逐步調整。 阿姨提醒：先看來源、再看自己今天會不會被影響。</p>
