      <h1>鋒面影響入夜中部以北防雷雨 薔蜜最快29日晚間轉中颱</h1>
      <p>（中央社記者黃巧雯台北28日電）氣象署表示，今晚至明天，中部以北和宜蘭地區有陣雨或雷雨，其他地區午後有局部短暫雷陣雨；預估颱風薔蜜明晚至30日增強為中度颱風，5月31日、6月1日將最接近台灣。 阿姨提醒：先看來源、再看自己今天會不會被影響。</p>
