      <h1>台北氣象站午後38.3度 刷新5月高溫紀錄</h1>
      <p>（中央社記者張雄風台北27日電）氣象署表示，今天下午2時許，台北氣象站高溫達攝氏38.3度，刷新該站5月最高溫紀錄；此外，受西南風持續吹拂影響，夜晚、清晨的低溫仍偏高，今天清晨台北站最低溫仍有28.7度。 阿姨提醒：先看來源、再看自己今天會不會被影響。</p>
