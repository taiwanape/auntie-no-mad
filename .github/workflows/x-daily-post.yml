name: X Daily Post

on:
  schedule:
    # 06:45 Asia/Taipei. GitHub cron is UTC.
    - cron: "45 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_SITE_URL: "http://auntienomad.com/"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Prepare social post data
        run: |
          npm run generate:share-pack
          npm run generate:social-posts

      - name: Validate content before posting
        run: |
          npm test
          npm run test:x-queue
          npm run test:x-daily-post

      - name: Audit X profile positioning
        run: npm run test:x-profile
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Publish daily X post
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run post:x | tee .tmp/x-post-output.log
        env:
          POST_TO_X: "true"
          X_POST_SOURCE: "social-posts"
          REQUIRE_DAILY_IMAGES: "true"
          FAIL_ON_SKIP: "true"
          POST_X_RESULT_PATH: ".tmp/x-post-result.json"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Summarize X post
        if: always()
        run: npm run summarize:x
        env:
          POST_X_RESULT_PATH: ".tmp/x-post-result.json"
