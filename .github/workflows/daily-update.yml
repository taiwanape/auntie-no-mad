name: Daily Auntie Update

on:
  schedule:
    # 04:00 Asia/Taipei. GitHub cron is UTC; this leaves room for GitHub queue delays before 07:00.
    - cron: "0 20 * * *"
    # 05:00 Asia/Taipei retry. GitHub schedules can be delayed or skipped under load.
    - cron: "0 21 * * *"
    # 06:00 Asia/Taipei backup run in case GitHub's first scheduled run is delayed or skipped.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this manual run to main and GitHub Pages"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PUBLIC_SITE_URL: "http://auntienomad.com/"

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check same-day daily publish
        id: daily_guard
        run: |
          SHOULD_SKIP=$(node - <<'NODE'
          const fs = require("node:fs");
          const today = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Taipei",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).format(new Date());
          const manualPublish = process.env.MANUAL_PUBLISH === "true";
          const content = JSON.parse(fs.readFileSync("data/site-content.json", "utf8"));
          const report = fs.existsSync("data/review-report.json")
            ? JSON.parse(fs.readFileSync("data/review-report.json", "utf8"))
            : {};
          const alreadyPublished =
            String(content.site?.updatedAt || "").startsWith(`${today}T`) &&
            report.date === today &&
            report.status === "approved";
          console.log(!manualPublish && alreadyPublished ? "true" : "false");
          NODE
          )
          echo "skip=$SHOULD_SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_SKIP" = "true" ]; then
            echo "Daily content for today is already approved; skipping image generation to avoid wasting API budget."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish }}" != "true" ]; then
            echo "Manual dry-run requested; skipping content and image generation. Current site files will still be validated."
          else
            echo "Daily content generation will run."
          fi
        env:
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}

      - name: Generate daily content and images
        if: (github.event_name == 'schedule' || github.event.inputs.publish == 'true') && steps.daily_guard.outputs.skip != 'true'
        run: npm run update:daily
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATE_DAILY_IMAGES: "true"
          OPENAI_IMAGE_MODEL: "gpt-image-1"
          OPENAI_IMAGE_QUALITY: "medium"
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_OUTPUT_FORMAT: "jpeg"
          OPENAI_IMAGE_OUTPUT_COMPRESSION: "88"
          OPENAI_IMAGE_LIMIT: "9"
          OPENAI_IMAGE_PROMPT_REVISION: "auntie-ref-v4"
          # Public daily updates must use fresh topic-specific AI images. If the API fails, keep yesterday's site instead of publishing stale fallback art.
          ALLOW_APPROVED_IMAGE_FALLBACK: "false"
          FORCE_APPROVED_IMAGE_FALLBACK: "false"

      - name: Generate SEO files
        run: npm run generate:seo

      - name: Generate share pack
        run: npm run generate:share-pack

      - name: Generate social post drafts
        run: npm run generate:social-posts

      - name: Generate today landing page
        run: npm run generate:today

      - name: Generate categorized archive page
        run: npm run generate:archive

      - name: Generate social link page
        run: npm run generate:links

      - name: Generate image debt report
        run: npm run audit:image-debt

      - name: Generate duplicate image debt report
        run: npm run audit:duplicate-image-debt

      - name: Validate content
        run: npm test

      - name: Audit site images
        run: npm run audit:images

      - name: Check image debt report
        run: npm run test:image-debt

      - name: Check duplicate image debt report
        run: npm run test:duplicate-image-debt

      - name: Audit social previews
        run: npm run test:social-previews

      - name: Summarize daily update
        if: always()
        run: npm run summarize:daily

      - name: Commit changes
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ radar/ stories/ stocks/ assets/generated/ sitemap.xml robots.txt rss.xml feed.json site.webmanifest llms.txt index.html today.html archive.html links.html
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "Daily content update $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git push
          fi

      - name: Configure Pages
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy Pages
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
