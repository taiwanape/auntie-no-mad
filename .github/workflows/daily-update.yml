name: Daily Auntie Update

on:
  schedule:
    # 05:30 Asia/Taipei. GitHub cron is UTC.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate daily content
        run: npm run update:daily

      - name: Generate SEO files
        run: npm run generate:seo

      - name: Validate content
        run: npm test

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ radar/ stories/ stocks/ sitemap.xml robots.txt index.html
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "Daily content update $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git push
          fi
