name: Daily Auntie Update

on:
  schedule:
    # 04:00 Asia/Taipei. GitHub cron is UTC; this leaves room for GitHub queue delays before 07:00.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate daily content and images
        run: npm run update:daily
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATE_DAILY_IMAGES: "true"
          OPENAI_IMAGE_MODEL: "gpt-image-1"
          OPENAI_IMAGE_QUALITY: "medium"
          OPENAI_IMAGE_SIZE: "1536x1024"
          OPENAI_IMAGE_LIMIT: "9"
          GENERATE_FALLBACK_IMAGES: "false"

      - name: Generate SEO files
        run: npm run generate:seo

      - name: Validate content
        run: npm test

      - name: Summarize daily update
        if: always()
        run: npm run summarize:daily

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ radar/ stories/ stocks/ assets/generated/ sitemap.xml robots.txt rss.xml feed.json index.html
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "Daily content update $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
