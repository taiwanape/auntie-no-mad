name: Domain Health Check

on:
  # Project paused on 2026-07-13. Manual runs only.
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check custom domain and try HTTPS enforcement
        run: npm run test:domain
        env:
          # GITHUB_TOKEN can read Pages state, but GitHub may reject Pages settings updates
          # with 403. Set GH_PAGES_TOKEN to a fine-grained token with repository Pages
          # write/admin permission if automatic HTTPS enforcement is needed.
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN || github.token }}
          AUNTIE_CUSTOM_DOMAIN: auntienomad.com
          ENABLE_PAGES_HTTPS: "true"
          AUNTIE_DOMAIN_STRICT: "false"
