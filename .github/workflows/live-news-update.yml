name: Live News Update

on:
  schedule:
    # Every 30 minutes from 07:00 to 23:30 Asia/Taipei.
    - cron: "0,30 23,0-15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  live-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Update live news
        run: npm run update:live-news

      - name: Generate SEO files
        run: npm run generate:seo

      - name: Generate share pack
        run: npm run generate:share-pack

      - name: Generate social post drafts
        run: npm run generate:social-posts

      - name: Generate today landing page
        run: npm run generate:today

      - name: Validate content
        run: npm test

      - name: Commit changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-content.json data/share-pack.json data/social-posts.json sitemap.xml robots.txt rss.xml feed.json site.webmanifest llms.txt today.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No live news changes to commit."
          else
            git commit -m "Live news update $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
