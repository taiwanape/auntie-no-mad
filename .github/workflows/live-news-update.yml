name: Live News Update

on:
  schedule:
    # About every 30 minutes from 07:17 to 23:47 Asia/Taipei, shifted off busy :00/:30 minutes.
    - cron: "17,47 23,0-15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PUBLIC_SITE_URL: "http://auntienomad.com/"

jobs:
  live-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Update live news
        run: npm run update:live-news

      - name: Generate SEO files
        run: npm run generate:seo

      - name: Generate share pack
        run: npm run generate:share-pack

      - name: Generate social post drafts
        run: npm run generate:social-posts

      - name: Generate today landing page
        run: npm run generate:today

      - name: Generate categorized archive page
        run: npm run generate:archive

      - name: Generate social link page
        run: npm run generate:links

      - name: Generate image debt report
        run: npm run audit:image-debt

      - name: Generate duplicate image debt report
        run: npm run audit:duplicate-image-debt

      - name: Validate content
        run: npm test

      - name: Audit site images
        run: npm run audit:images

      - name: Check image debt report
        run: npm run test:image-debt

      - name: Check duplicate image debt report
        run: npm run test:duplicate-image-debt

      - name: Audit social previews
        run: npm run test:social-previews

      - name: Commit changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-content.json data/live-news-report.json data/share-pack.json data/social-posts.json data/site-image-debt.json data/site-duplicate-image-debt.json sitemap.xml robots.txt rss.xml feed.json site.webmanifest llms.txt index.html today.html archive.html links.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No live news changes to commit."
          else
            git commit -m "Live news update $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
