name: Ops Health Check

on:
  schedule:
    # 08:15 Asia/Taipei. GitHub cron is UTC.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run operations health check
        run: npm run ops:health
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_HEALTH_REQUIRE_X: "true"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
