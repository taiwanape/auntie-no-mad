name: Ops Health Check

on:
  # Project paused on 2026-07-13. Manual runs only.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate site content and growth pages
        run: npm test

      - name: Audit site images
        run: npm run audit:images

      - name: Check image debt report
        run: npm run test:image-debt

      - name: Check duplicate image debt report
        run: npm run test:duplicate-image-debt

      - name: Audit social previews
        run: npm run test:social-previews

      - name: Validate X daily post readiness
        run: npm run test:x-daily-post

      - name: Validate Meta daily post readiness
        run: npm run test:meta-post

      - name: Check custom domain and retry HTTPS enforcement
        run: npm run test:domain
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN || github.token }}
          AUNTIE_CUSTOM_DOMAIN: auntienomad.com
          ENABLE_PAGES_HTTPS: "true"
          AUNTIE_DOMAIN_STRICT: "false"

      - name: Run operations health check
        run: npm run ops:health
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_HEALTH_INCLUDE_SOCIAL: "false"
          OPS_HEALTH_REQUIRE_X: "false"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
