      <h1>台南新化貨機車相撞1死 貨車駕駛棄車逃逸追查中</h1>
      <p class="">（中央社記者張榮祥台南19日電）台南市新化區崙頂里防汛道路日前發生貨車和機車相撞，造成機車騎士送醫不治，貨車駕駛棄車逃逸；警方調查，貨車駕駛疑似外籍移工，檢警追查中。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
      <h2>阿姨幫你翻譯</h2>
      <p>這篇整理自公開來源。阿姨不幫你製造焦慮，只幫你抓重點：先確認來源，再決定今天要不要調整行程、錢包或心情。</p>
