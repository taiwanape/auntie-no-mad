      <h1>酒駕罰單引口角縱火 新北男涉公共危險遭移送</h1>
      <p class="">（中央社記者黃旭昇新北4日電）新北市新店區51歲陳姓男子疑因酒駕罰單問題與妻子發生爭執後，今天下午在住家臥室縱火。警消到場滅火時1名警員嗆傷，與夫妻共3人都送醫無礙，全案依公共危險罪嫌移送偵辦。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
