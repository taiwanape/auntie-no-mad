      <h1>台中婦網戀假軍官 匯款前求證警方保住32萬</h1>
      <p>（中央社記者蘇木春台中28日電）台中林姓女子與一名自稱美軍前軍官談網戀，對方稱要寄包裹給她，但要支付新台幣32萬元規費；她到郵局等待匯款時，手機滑到反詐騙資訊，到警局確認自己險被騙，成功保住積蓄。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
