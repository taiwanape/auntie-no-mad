      <h1>男子瑞芳拆鷹架突倒塌 3公尺高處摔落骨折</h1>
      <p>（中央社記者王朝鈺新北市27日電）新北市瑞芳區三爪子坑路一間民宅整修外牆，39歲蕭姓男子今天下午拆除鷹架時，鷹架突然倒塌，蕭男從3公尺高處摔落至地面，造成肋骨骨折、雙側肺部挫傷，所幸意識清楚送醫治療。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
      <h2>阿姨幫你翻譯</h2>
      <p>這篇整理自公開來源。阿姨不幫你製造焦慮，只幫你抓重點：先確認來源，再決定今天要不要調整行程、錢包或心情。</p>
