      <h1>林姓專員涉查個資遭羈押 警政署：依規停職</h1>
      <p>（中央社記者黃麗芸台北27日電）警政署林姓專員涉協助富商鍾文智查詢個資，台北地檢署於昨天搜索、約談，法院今天裁准羈押禁見。警政署晚間說，已依規定予以停職，行政責任部分將視刑案偵審結果依法議處。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
