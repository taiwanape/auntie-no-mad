      <h1>建商遭假投資詐騙 銀樓公會公布金條序號助追查</h1>
      <p class="">（中央社記者郭宣彣新竹縣3日電）新竹邱姓建商誤信假投資詐騙，損失逾6500萬元，其中包含大量（UBS）瑞士銀行投資級金條，全國銀樓同業公會今天公告金條序號，籲業者如發現應停止交易、通報警方追查流向。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
      <h2>阿姨幫你翻譯</h2>
      <p>這篇整理自公開來源。阿姨不幫你製造焦慮，只幫你抓重點：先確認來源，再決定今天要不要調整行程、錢包或心情。</p>
