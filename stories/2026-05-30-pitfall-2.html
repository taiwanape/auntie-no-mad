      <h1>基隆國門廣場發生男女脫序行為 警方掌握線索偵辦</h1>
      <p>（中央社記者沈如峰基隆29日電）基隆市國門廣場最近一對男女在人工草皮從事脫序行為，影片在社群流傳，網友稱是擎天崗2.0事件。警方今天說，已鎖定當事人行蹤並通知散佈影像者到案說明，釐清案情。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
      <h2>阿姨幫你翻譯</h2>
