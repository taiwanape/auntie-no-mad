      <h1>詐騙假冒綠界支付 刑事局籲慎防新詐騙手法</h1>
      <p>（中央社記者劉建邦台北30日電）刑事局今天表示，詐騙集團利用假冒綠界第三方支付的LINE帳號名義，且會提及「先買後付、無卡分期、錯誤下單」等話術，此為新型態的詐騙手法，呼籲民眾注意。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
      <h2>阿姨幫你翻譯</h2>
