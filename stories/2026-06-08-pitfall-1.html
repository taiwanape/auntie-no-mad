      <h1>台東男子到台南走失 警網巡發現線索平安尋獲</h1>
      <p class="">（中央社記者楊思瑞台南7日電）台東縣39歲邱姓男子5日與友人一起開車送菜到台南，與友人發生口角負氣下車，因未帶手機與證件失聯，家屬透過社群網站貼文協尋，警方主動協助，昨天在永康區尋獲並通知家屬帶回。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
