      <h1>新北男假結婚真詐財 彰檢警搜索住處查獲百萬現金</h1>
      <p>（中央社記者鄭維真彰化28日電）新北市羅姓男子涉嫌利用交友軟體，以假結婚真詐財手法向多名女子騙取財物，彰化地檢署26日指揮搜索並拘提，訊後認其涉詐欺取財犯嫌重大，且有滅證及再犯之虞，聲押獲准。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
