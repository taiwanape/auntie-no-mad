      <h1>2中國男自稱中醫疑涉醫療行為 檢警聲押獲准</h1>
      <p>（中央社記者王鴻國連江縣27日電）2名中國籍黃姓男子在連江縣南竿鄉與北竿鄉，涉嫌謊稱具備大陸中醫師資格，從事問診、把脈及兜售不明成分藥丸等醫療行為，經檢警偵辦並向法院聲押獲准。 阿姨提醒：越急、越便宜、越像好康，越要先停三秒。</p>
      <div class="notice"><strong>阿姨一句話：</strong>不是你笨，是套路越來越會穿西裝。</div>
      <h2>阿姨幫你翻譯</h2>
      <p>這篇整理自公開來源。阿姨不幫你製造焦慮，只幫你抓重點：先確認來源，再決定今天要不要調整行程、錢包或心情。</p>
